<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Резюме Юрий Николаевич Хмарин — UX/UI дизайнер</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 30px auto;
        padding: 0 20px;
        color: #333;
        /* background-color: #f9f9f9; */
      }
      h1,
      h2 {
        color: #2c3e50;
      }
      .header {
        border-bottom: 2px solid hsl(224, 64%, 44%);
        padding-bottom: 24px;
        margin-bottom: 24px;
        /* background-color: #f9f9f9; */
      }

      .header img {
        width: 100px;
      }

      a {
        color: hsl(224, 64%, 44%);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      section {
        margin-bottom: 25px;
      }
      ul {
        list-style-type: disc;
        margin-left: 20px;
      }
      .contact-info p {
        margin: 4px 0;
      }
      .job-title {
        font-weight: bold;
        color: #34495e;
      }
      .job-period {
        font-style: italic;
        color: #7f8c8d;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
      }
      th,
      td {
        border: 1px solid hsl(0, 0%, 87%);
        padding: 12px;
        text-align: left;
      }
      th {
        background-color: hsl(0, 0%, 95%);
        font-weight: bold;
      }
      tr:nth-child(even) {
        background-color: hsl(0, 0%, 98%);
      }
      .subtext {
        color: hsl(0, 0%, 53%);
        font-size: 0.9em;
      }
    </style>
  </head>
  <body></body>
</html>
